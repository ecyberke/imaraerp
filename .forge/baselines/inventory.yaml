schema_surface:
  migrations: 122
  tables: 115
  domain_entities: 106          # one per Eloquent model, recorded in domain.yaml `entities`
  infrastructure_tables_without_model: [cache, cache_locks, failed_jobs, job_batches, jobs, migrations, password_reset_tokens, personal_access_tokens, sessions]
  foreign_keys: 301
  unique_constraints: 27
  non_unique_indexes: 31
  check_constraints: 0           # status/enum values are enforced in application code only
  timestamp_type: "timestamp(0) without time zone everywhere; no timestamptz, no uuid columns"
  numeric_columns: "48, all quantities, rates, percentages, hours or meter readings — none holds money (money columns are bigint *_cents)"
  unconstrained_id_columns:
    polymorphic_by_design: [audit_logs.entity_id, boqs.boqable_id, contract_retention_terms.contract_id, demand_triggers.source_id,
                            invoice_lines.lineable_id, invoice_lines.source_id, journal_entries.reference_id, notifications.entity_id,
                            payments.reference_id, quality_checks.checkable_id, retention_accounts.contract_id, stock_ledger.reference_id,
                            stock_reservations.reference_id, supplier_payments.reference_id]
    deliberate_no_location_entity: [assets.location_id, stock_ledger.location_id]   # WMS backlog §14 (create_assets_table.php:17-19, create_stock_ledger_table.php:23)
    forward_reference_never_closed: [sales_returns.credit_note_id, users.employee_id]   # KI-012
  table_purpose_questions:
    - table: dummy_records
      read: "Exists only for platform-foundation's HTTP cross-tenant isolation test; its migration says 'Not an ERP entity ... safe to drop once a real tenant-scoped entity exists' (2026_09_12_000005_create_dummy_records_table.php:4-11)."
      question: "Keep it as a test fixture, or drop it once SEC-TEST-002 (TASK-122) covers isolation on real resources? Dropping is destructive — owner decides."
      decision: "Owner (TASK-103, 2026-10-02): TASK-122 moves the isolation test to real resources, then drops the table."
