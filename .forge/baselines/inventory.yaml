known_issues:   # recorded, not fixed silently (brownfield.md). verdict: confirmed | confirmed-broader | refuted-as-worded | resolved-in-part
  - id: KI-001
    issue: README.md is unmodified Vite/Vue template boilerplate; handover says not to follow it
    verdict: confirmed
    evidence: "README.md:1-3 — empty '# ' title, then 'This template should help get you started developing with Vue 3 in Vite.'"
    tracked_by: TASK-104
  - id: KI-002
    issue: Audit observer was absent from Invoice, Payment, PO, VO, RetentionRelease until PR #18; coverage not mechanically enforced
    verdict: confirmed-broader
    evidence: >-
      The five named models now carry #[ObservedBy(AuditLogObserver::class)] (Invoice.php:13, Payment.php:13,
      PurchaseOrder.php:19, VariationOrder.php:13, RetentionRelease.php:13). Enforcement is still absent: no
      tests/Architecture/ directory exists. A heuristic scan (model file mentions a *_cents field, no observer)
      finds 36 more models without the observer: ApprovalLimit, AssetDepreciationEntry, Boq, BoqImportStaging,
      BoqLine, CapitalMovement, ContractRetentionTerms, CreditApproval, CreditNote, DebitNote, DeliveryLine,
      GRNLine, InvoiceLine, Item, JournalEntry, JournalLine, LandedCost, Milestone, MpesaStkRequest, P10, P9A,
      Party, PaymentAllocation, ProductionOrder, ProgressClaim, PurchaseOrderLine, RetentionAccount, SalesOrder,
      SalesOrderLine, StockLedger, StockQuarantine, SupplierPayment, SupplierReturn, VariationOrderLine,
      VariationOrderReversalLine, WriteOff. Which of these are "money-bearing" is TASK-120's call.
    tracked_by: TASK-120
  - id: KI-003
    issue: M-Pesa callback settles from the unsigned callback body; architecture §1.1 promises HMAC + nonce the provider cannot supply
    verdict: confirmed
    evidence: >-
      POST /api/webhooks/mpesa/callback has no auth middleware (routes/api.php:94-95). MpesaService::handleCallback
      (app/Services/MpesaService.php:147) reads ResultCode from the body (:170) and calls PaymentService::receive (:188)
      without confirming with Daraja; the service's only outbound calls are OAuth (:56) and STK push (:102) — no STK Query.
    tracked_by: TASK-133
  - id: KI-004
    issue: eTIMS retains raw provider responses on failure; may include the device communication key
    verdict: confirmed-broader
    evidence: >-
      Retained on every outcome, not only failure: response_payload = $body is set before the success branch
      (app/Services/EtimsService.php:117, also :173), and on success that body contains cmcKey (:115). It is
      stored as plain json (EtimsSubmission casts response_payload to array, app/Models/EtimsSubmission.php:28,
      no $hidden), while the same key is kept encrypted in IntegrationCredential. EtimsController returns the
      whole submission (app/Http/Controllers/EtimsController.php:19), so the plaintext cmcKey is also sent in
      the HTTP response to the admin who initialised the device.
    tracked_by: [TASK-140, TASK-137]   # TASK-140 hotfix first in Phase 1; TASK-137 redaction and key rotation
  - id: KI-005
    issue: No Sanctum token expiry documented
    verdict: confirmed
    evidence: "config/sanctum.php:53 'expiration' => null — tokens never expire"
    tracked_by: TASK-130
  - id: KI-006
    issue: Purchase Orders cannot be cancelled; Project.cancel() can only flag open POs
    verdict: confirmed-broader
    evidence: >-
      PurchaseOrder::STATUSES has no 'cancelled' (app/Models/PurchaseOrder.php:22-26) and no cancel route exists.
      Project.cancel() does not flag open POs either — it does not touch them at all; its docblock records PO and
      Subcontract/ProgressClaim handling as "NOT enforced here" (app/Services/ProjectService.php:192-201, cancel() at :204).
    tracked_by: TASK-180
  - id: KI-007
    issue: execution_plan.md still instructs assertEqualsWithDelta for money after the switch to integer cents
    verdict: confirmed-broader
    evidence: >-
      execution_plan.md:156 instructs assertEqualsWithDelta "for every monetary comparison". One live use on money
      remains in the suite: tests/Feature/HrPayrollTest.php:213 asserts debit_cents / 100 / 2 within 0.01 (ADR-008;
      forge validate also warns STD-TST-005 on TEST-023).
    tracked_by: TASK-104
  - id: KI-008
    issue: TenantScope filters nothing when no user is authenticated, so scheduled commands run across all tenants with no explicit tenant context
    verdict: confirmed (reworded by TASK-103; the draft said jobs resolve the tenant through the auth guard, which is not what the code does)
    evidence: >-
      TenantScope applies its tenant_id filter only when a Sanctum user resolves (app/Models/Scopes/TenantScope.php:46-48);
      no console code touches the auth guard. All five scheduled commands therefore run unscoped. TASK-103 read every
      query they reach (there are no queued jobs, listeners or queued notifications in app/): none resolves another
      tenant's row by code or name. The cross-tenant queries are deliberate sweeps that write in place:
      UserInvitation expired-row delete (app/Console/Commands/PruneExpiredInvitations.php:22-25, deletes);
      ResourceAssignment scheduled->active and active->completed (app/Services/ResourceAssignmentService.php
      advanceScheduledTransitions, updates); Project defects_liability scan (app/Services/ProjectService.php:102, updates
      dlp_ready_to_close and creates Notifications); Notification digest sweep (app/Services/NotificationService.php
      dispatchDueDigests, updates sent_at). Downstream lookups pin tenant_id (LedgerPostingService.php:140-180,
      AccountingPeriodResolver.php:46-68, DocumentSequenceService.php:51-75, NotificationService::notifyRole,
      Defect lookup ProjectService.php DLP block) or go by globally unique id. Depreciation iterates Tenant::all()
      and filters assets by tenant_id (RunMonthlyAssetDepreciation.php:29, DepreciationRunService.php:45). The
      unauthenticated M-Pesa callback path also pins tenant_id (PaymentService::receive). Risk is structural, not an
      active leak: any new job or command written without an explicit TenantContext inherits an unscoped query layer.
    tracked_by: TASK-135
  - id: KI-009
    issue: Performance targets (§1.1) never measured; restore and migration rehearsal never run
    verdict: confirmed
    evidence: >-
      No load, restore or rehearsal artefacts exist: tests/load/, scripts/perf/ and scripts/ops/ are absent, and no
      tracked file matches k6/restore/rehears/pitr/backup. The performance dimension's commands reference files
      that do not exist yet (verification/dimensions.yaml).
    tracked_by: [TASK-173, TASK-154, TASK-155]
  - id: KI-010
    issue: Employee self-service payslip promised in Imara-ERP-ARCHITECTURE.md:539 (§12 Open Decisions, item 9) but no employee role exists
    verdict: confirmed
    evidence: >-
      Role::CATALOG has nine roles and no employee role (app/Models/Role.php:31-41). The promise is at
      Imara-ERP-ARCHITECTURE.md:539 (resolved question 9: "An employee's own Payslip remains visible to
      themselves via self-service"). "§12.9" in the draft meant §12 Open Decisions, item 9 — the same place; references now cite the line.
    tracked_by: TASK-184
  - id: KI-011
    issue: typed-router.d.ts is tracked but regenerated by unplugin-vue-router whenever a dev server or build runs, so a running dev server dirties the tree and will invalidate release candidates
    verdict: confirmed
    evidence: "seen modified on main with no source change on 2026-10-02 while a node dev server was running; discarded with git checkout"
    decision_needed: "commit-and-regenerate (keep tracked; CI regenerates and fails on drift) vs untrack (gitignore it; generated at build time)"
    tracked_by: TASK-104
  - id: KI-012
    issue: Two forward-reference columns were never given their foreign key after the referenced table landed
    verdict: confirmed
    evidence: >-
      sales_returns.credit_note_id (2026_09_25_000007_create_sales_returns_table.php:15,31 — "forward reference to
      finance-billing's CreditNote") and users.employee_id (2026_09_19_000007_add_employee_id_to_users_table.php:19)
      are plain nullable bigints; credit_notes and employees now exist. resources.employee_id, the same pattern,
      did get its FK.
    tracked_by: TASK-139
  - id: KI-013
    issue: A tracked, never-run copy of the v19 LedgerPostingService reference implementation and tests sits at the repo root
    verdict: confirmed
    evidence: >-
      LedgerPostingServiceTest.php (1836 lines, 59 tests, committed in 0a4fed9 project-init) differs from
      tests/Feature/LedgerPostingServiceTest.php (893 lines, 65 tests); phpunit.xml suites cover only tests/Unit and
      tests/Feature, so it never runs.
    tracked_by: TASK-104
  - id: KI-014
    issue: The runtime dimension and the draft inventory probe /health, which does not exist unauthenticated
    verdict: confirmed — fixed in TASK-103
    evidence: >-
      verification/dimensions.yaml runtime curls http://127.0.0.1:8000/health and /ready; the real probes are
      GET /up and GET /api/ready, and /api/health requires auth:sanctum (routes/api.php:114). runtime.yaml
      readiness_url was corrected to /api/ready under TASK-102. TASK-103 fixed the runtime dimension (curl /up and /api/ready), the architecture interface text, NFR-003, TASK-157, ADR-010's smoke trigger and both v1.1.0 docs.
    tracked_by: [TASK-115, TASK-157]
  - id: KI-015
    issue: After the TASK-103 matrix decisions, six view-only grants in the matrix are not yet implemented in code, and two matrix resources still have no Policy class
    verdict: confirmed
    evidence: >-
      Gate::forUser()->allows() per role (TASK-102 probe, re-checked after the TASK-103 matrix edits) denies:
      InvoicePolicy@view for sales and project_manager (POLICY-002); PurchaseOrderPolicy@view for finance and
      project_manager (POLICY-006); AssetPolicy@view for finance (POLICY-010); MilestonePolicy@view for finance
      (POLICY-011). No Policy class exists for JournalEntry (POLICY-001, now update/delete deny only) or for user
      role assignment (POLICY-015, now remove_last_admin deny only); with no route either, those deny-only actions
      hold. Payslip view is governed by PayrollRunPolicy@view; AuditLogPolicy covers POLICY-005's deny-only actions.
    tracked_by: TASK-113 (the six grants); TASK-124 adds the user-management policy when it re-adds POLICY-015 actions
  - id: KI-016
    issue: Lockout test is timing-sensitive
    verdict: confirmed
    evidence: "tests/Feature/PlatformOpsTest.php:69 asserts 'Try again in 900 seconds' exactly; failed once in a slow full run on 2026-10-02 and passed alone"
    tracked_by: TASK-104
