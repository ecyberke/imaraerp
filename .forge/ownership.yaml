schema: forge/ownership/v2
classes:
  FORGE:
  - read
  - validate
  - create_if_absent
  - write
  - overwrite
  - delete
  USER:
  - read
  - validate
  MIXED:
  - read
  - validate
  - create_if_absent
  - write_between_markers
  PROJECT:
  - read
  - validate
  - create_if_absent
  - merge
paths:
- pattern: .forge/.state-integrity.json
  class: FORGE
- pattern: .forge/ai-prompt.yaml
  class: FORGE
- pattern: .forge/architecture.yaml
  class: MIXED
- pattern: .forge/assumptions.yaml
  class: MIXED
- pattern: .forge/baselines/
  class: USER
- pattern: .forge/capabilities.yaml
  class: MIXED
- pattern: .forge/contracts/
  class: MIXED
- pattern: .forge/decisions/
  class: USER
- pattern: .forge/design-system.md
  class: MIXED
- pattern: .forge/domain.yaml
  class: MIXED
- pattern: .forge/evidence/
  class: FORGE
- pattern: .forge/exceptions.yaml
  class: MIXED
- pattern: .forge/execution-plan.yaml
  class: MIXED
- pattern: .forge/human-acceptance.yaml
  class: USER
- pattern: .forge/manifest.yaml
  class: FORGE
- pattern: .forge/ownership.yaml
  class: FORGE
- pattern: .forge/project.yaml
  class: USER
- pattern: .forge/release-candidates/
  class: FORGE
- pattern: .forge/requirements.yaml
  class: MIXED
- pattern: .forge/reviews.yaml
  class: USER
- pattern: .forge/runtime.yaml
  class: MIXED
- pattern: .forge/self-audit.yaml
  class: FORGE
- pattern: .forge/specs.yaml
  class: MIXED
- pattern: .forge/standards.yaml
  class: MIXED
- pattern: .forge/state.yaml
  class: FORGE
- pattern: .forge/tasks.yaml
  class: MIXED
- pattern: .forge/test-plan.yaml
  class: MIXED
- pattern: .forge/verification/
  class: MIXED
- pattern: .forge/views/
  class: FORGE
- pattern: .github/workflows/
  class: PROJECT
- pattern: AGENTS.md
  class: MIXED
- pattern: CLAUDE.md
  class: MIXED
- pattern: Dockerfile
  class: PROJECT
- pattern: README.md
  class: MIXED
- pattern: e2e/
  class: PROJECT
- pattern: migrations/
  class: PROJECT
- pattern: package.json
  class: PROJECT
- pattern: pyproject.toml
  class: PROJECT
- pattern: src/
  class: PROJECT
- pattern: tests/
  class: PROJECT
