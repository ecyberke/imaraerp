    lifecycle: [create, read, update]
state_machines:
  PurchaseOrder:
    states: [requisitioned, pending_approval, approved, ordered, partially_received, received, quarantined, qc_passed, qc_failed, stocked, returned, cancelled, short_closed]
    transitions:
      - { from: requisitioned, to: pending_approval, by: user }
      - { from: pending_approval, to: approved, by: user }
      - { from: approved, to: ordered, by: user }
      - { from: ordered, to: partially_received, by: user }
      - { from: partially_received, to: received, by: user }
      - { from: ordered, to: received, by: user }
      - { from: pending_approval, to: cancelled, by: user }
      - { from: approved, to: cancelled, by: user }
      - { from: ordered, to: cancelled, by: user }
      - { from: partially_received, to: short_closed, by: user }
    invalid:
      - { from: received, to: cancelled }
      - { from: partially_received, to: cancelled }
      - { from: cancelled, to: ordered }
      - { from: short_closed, to: partially_received }
  MpesaStkRequest:
    states: [pending_external, confirming, succeeded, failed, cancelled, expired]
    transitions:
      - { from: pending_external, to: confirming, by: external }
      - { from: pending_external, to: confirming, by: system }
      - { from: confirming, to: succeeded, by: system }
      - { from: confirming, to: failed, by: system }
      - { from: confirming, to: cancelled, by: system }
      - { from: pending_external, to: expired, by: system }
    invalid:
      - { from: pending_external, to: succeeded }
      - { from: succeeded, to: failed }
      - { from: succeeded, to: confirming }
      - { from: expired, to: succeeded }
  Project:
    states: [initiated, in_progress, complete, defects_liability, closed, cancelled]
    transitions:
      - { from: initiated, to: in_progress, by: user }
      - { from: in_progress, to: complete, by: user }
      - { from: complete, to: defects_liability, by: system }
      - { from: defects_liability, to: closed, by: user }
      - { from: initiated, to: cancelled, by: user }
      - { from: in_progress, to: cancelled, by: user }
      - { from: complete, to: cancelled, by: user }
      - { from: defects_liability, to: cancelled, by: user }
    invalid:
      - { from: closed, to: in_progress }
      - { from: cancelled, to: in_progress }
      - { from: complete, to: closed }
invariants:
  INV-001:
    statement: Every posted JournalEntry has sum(debit cents) = sum(credit cents), enforced by a deferred constraint trigger, not only by the service.
    enforced_by: [SPEC-003]
  INV-002:
    statement: Posted JournalEntry/JournalLine rows and AuditLog rows are never updated or deleted; correction is a new reversing entry.
    enforced_by: [SPEC-003, SPEC-004]
  INV-003:
    statement: For any set of postings, the tenant trial balance nets to zero for every period.
    enforced_by: [SPEC-003, SPEC-007]
  INV-004:
    statement: Document numbers are gap-free and unique per tenant, entity type and Kenyan tax year.
    enforced_by: [SPEC-003]
    concurrency:
      scenario: Two requests issue the next invoice number for the same tenant and year at the same instant.
      protection: pessimistic_lock
  INV-005:
    statement: Active hard reservations never exceed computed available stock per item and warehouse.
    enforced_by: [SPEC-006]
    concurrency:
      scenario: Two orders hard-reserve the last unit simultaneously.
      protection: pessimistic_lock
  INV-006:
    statement: Open credit exposure plus a new credit invoice never exceeds the client credit limit unless an approved override exists.
    enforced_by: [SPEC-007]
    concurrency:
      scenario: Two credit checks for the same client run simultaneously.
      protection: pessimistic_lock
  INV-007:
    statement: A milestone is signed off at most once per cycle.
    enforced_by: [SPEC-008]
    concurrency:
      scenario: Two users sign off the same milestone simultaneously.
      protection: pessimistic_lock
  INV-008:
    statement: Concurrent variation-order approvals on one BOQ line serialize and both deltas apply exactly once.
    enforced_by: [SPEC-008]
    concurrency:
      scenario: Two VOs touching the same BOQ line are approved simultaneously.
      protection: pessimistic_lock
  INV-009:
    statement: Each approval stage records exactly one decision, and the second approver is a different user from the first.
    enforced_by: [SPEC-010]
    concurrency:
      scenario: Two approvers act on the same stage simultaneously, or one user submits both stages from two sessions.
      protection: unique_constraint
  INV-010:
    statement: At most one Payment exists per M-Pesa CheckoutRequestID and per M-Pesa receipt number within a tenant.
    enforced_by: [SPEC-011]
    concurrency:
      scenario: Safaricom delivers the same callback twice in parallel while the reconciliation job also confirms it.
      protection: unique_constraint
  INV-011:
    statement: A mutating request with a given idempotency key takes effect at most once and replays the stored response.
    enforced_by: [SPEC-014]
    concurrency:
      scenario: A double-clicked submit sends the same key twice in parallel.
      protection: unique_constraint
  INV-012:
    statement: A project cannot be closed against a stale DLP-eligibility evaluation.
    enforced_by: [SPEC-008]
    concurrency:
      scenario: The DLP-eligibility job re-evaluates while a user confirms closure.
      protection: optimistic_lock
  INV-013:
    statement: Cumulative retention withheld on a contract never exceeds retention_cap (inclusive).
    enforced_by: [SPEC-007]
  INV-014:
    statement: An employee never has two overlapping employment contracts.
    enforced_by: [SPEC-009]
  INV-015:
    statement: After run, approve, disburse and remit, every payroll payable nets to zero.
    enforced_by: [SPEC-009]
  INV-016:
    statement: Depreciation runs at most once per asset per period and never below residual value.
    enforced_by: [SPEC-008]
  INV-017:
    statement: Every tenant-scoped row read or written in a job, command or request belongs to the active TenantContext.
    enforced_by: [SPEC-015]
authorization:
  POLICY-001:
    resource: journal_entry
    requirement: REQ-006
    actions:
      view: { finance: tenant_scoped, admin: tenant_scoped, sales: deny, procurement: deny, warehouse: deny, project_manager: deny, site_supervisor: deny, asset_manager: deny, hr_manager: deny }
      create: { finance: tenant_scoped, admin: tenant_scoped, sales: deny, hr_manager: deny }
      reverse: { finance: tenant_scoped, admin: tenant_scoped, sales: deny }
      update: { finance: deny, admin: deny }
      delete: { finance: deny, admin: deny }
    notes: create/reverse also require completed MFA (REQ-003). Payroll postings reach Finance only as aggregate lines.
  POLICY-002:
    resource: invoice
    requirement: REQ-012
    actions:
      view: { finance: tenant_scoped, sales: tenant_scoped, project_manager: tenant_scoped, procurement: tenant_scoped, warehouse: tenant_scoped, admin: tenant_scoped, hr_manager: deny, site_supervisor: deny, asset_manager: deny }
      create: { finance: tenant_scoped, sales: tenant_scoped, admin: tenant_scoped, procurement: deny, warehouse: deny }
      issue_credit_note: { finance: tenant_scoped, admin: tenant_scoped, sales: deny }
      write_off: { finance: tenant_scoped, admin: tenant_scoped, sales: deny }
    notes: Role mapping derived from the User Manual; TASK-113 reconciles it against the real Policy classes and raises disagreements as decisions.
  POLICY-003:
    resource: payment
    requirement: REQ-020
    actions:
      view: { finance: tenant_scoped, sales: tenant_scoped, admin: tenant_scoped, hr_manager: deny, warehouse: deny }
      record: { finance: tenant_scoped, admin: tenant_scoped, sales: deny }
      initiate_stk_push: { finance: tenant_scoped, sales: tenant_scoped, admin: tenant_scoped, warehouse: deny }
    notes: The Daraja callback is unauthenticated by necessity and is governed by ADR-002, not by this policy.
  POLICY-004:
    resource: payslip
    requirement: REQ-031
    actions:
      view: { hr_manager: tenant_scoped, admin: tenant_scoped, finance: deny, sales: deny, project_manager: deny, procurement: deny, warehouse: deny, site_supervisor: deny, asset_manager: deny }
      update: { hr_manager: tenant_scoped, admin: deny, finance: deny }
    notes: Admin view pending ASM-007. Employee own_only access pending ASM-011 (no employee role exists yet).
  POLICY-005:
    resource: audit_log
    requirement: REQ-022
    actions:
      view: { admin: tenant_scoped, finance: tenant_scoped, hr_manager: deny, sales: deny, procurement: deny, warehouse: deny, project_manager: deny, site_supervisor: deny, asset_manager: deny }
      update: { admin: deny, finance: deny }
      delete: { admin: deny, finance: deny }
    notes: Finance's view excludes rows whose subject is Payslip, Employee or EmploymentContract (row filter, enforced in the query and tested by SEC-TEST-003). The schema cannot express row filters.
  POLICY-006:
    resource: purchase_order
    requirement: REQ-011
    actions:
      view: { procurement: tenant_scoped, finance: tenant_scoped, warehouse: tenant_scoped, project_manager: tenant_scoped, admin: tenant_scoped, sales: deny, hr_manager: deny }
      create: { procurement: tenant_scoped, admin: tenant_scoped, warehouse: deny, sales: deny }
