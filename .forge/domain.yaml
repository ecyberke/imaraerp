schema: forge/domain/v2
# Brownfield entities (TASK-102): generated from the PostgreSQL catalog after running all 122
# migrations on a fresh database at eeb528c, one entry per Eloquent model (106 models <-> 106 tables).
# Field strings are the real column definitions: type, pk, fk -> table.column [on delete ...],
# null/not null, default, unique / unique(cols) (a composite unique sits on its last column).
# `indexes` lists only non-unique, non-PK indexes. No CHECK constraints exist, so status values are
# enforced in application code only. Laravel infrastructure tables without an app model (cache,
# cache_locks, jobs, job_batches, failed_jobs, migrations, sessions, password_reset_tokens,
# personal_access_tokens) are listed in baselines/inventory.yaml, not here.
entities:
  AccountingPeriod:   # table: accounting_periods
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      start_date: date not null
      end_date: date not null
      status: character varying(255) not null default 'open'
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
    indexes:
      - [tenant_id, status]
  AnalyticAccount:   # table: analytic_accounts
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      cost_code: character varying(255) not null unique(tenant_id, cost_code)
      name: character varying(255) not null
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  ApprovalLimit:   # table: approval_limits
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      role_id: bigint fk -> roles.id not null
      entity_type: character varying(255) not null unique(tenant_id, role_id, entity_type)
      max_amount_cents: bigint not null
      requires_second_approval_above_cents: bigint null
      second_approver_role_id: bigint fk -> roles.id on delete set null null
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  Asset:   # table: assets
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      asset_number: character varying(255) not null unique(tenant_id, asset_number)
      name: character varying(255) not null
      category_id: bigint fk -> asset_categories.id not null
      asset_type: character varying(255) not null
      serial_number: character varying(255) null
      location_id: bigint null
      custodian_party_id: bigint fk -> parties.id on delete set null null
      date_of_purchase: date not null
      purchase_cost_cents: bigint not null
      residual_value_cents: bigint not null default '0'
      useful_life_years: integer not null
      depreciation_method: character varying(255) not null
      warranty_years: integer null
      status: character varying(255) not null default 'in_use'
      lifespan_change_reason: text null
      schedule_reset_at: date null
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  AssetAssignment:   # table: asset_assignments
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      asset_id: bigint fk -> assets.id not null
      project_id: bigint fk -> projects.id not null
      assigned_date: date not null
      released_date: date null
      internal_daily_rate_cents: bigint not null
      meter_reading_start: numeric(12,2) null
      meter_reading_end: numeric(12,2) null
      status: character varying(255) not null default 'active'
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  AssetCategory:   # table: asset_categories
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      name: character varying(255) not null
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  AssetComponent:   # table: asset_components
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      asset_id: bigint fk -> assets.id on delete cascade not null
      name: character varying(255) not null
      purchase_cost_cents: bigint not null
      residual_value_cents: bigint not null default '0'
      useful_life_years: integer not null
      depreciation_method: character varying(255) not null
      lifespan_change_reason: text null
      schedule_reset_at: date null
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  AssetDepreciationEntry:   # table: asset_depreciation_entries
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      asset_id: bigint fk -> assets.id on delete cascade null
      asset_component_id: bigint fk -> asset_components.id on delete cascade null
      period: date not null unique(asset_component_id, period) unique(asset_id, period)
      depreciation_amount_cents: bigint not null
      accumulated_depreciation_cents: bigint not null
      net_book_value_cents: bigint not null
      journal_entry_id: bigint fk -> journal_entries.id on delete set null null
      created_at: timestamp(0) without time zone not null default CURRENT_TIMESTAMP
  AssetDisposal:   # table: asset_disposals
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      asset_id: bigint fk -> assets.id not null
      disposal_date: date not null
      disposal_type: character varying(255) not null
      sale_proceeds_cents: bigint not null default '0'
      sold_on_credit: boolean not null default false
      net_book_value_at_disposal_cents: bigint not null
      gain_loss_amount_cents: bigint not null
      status: character varying(255) not null default 'completed'
      journal_entry_id: bigint fk -> journal_entries.id on delete set null null
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  AssetRevaluation:   # table: asset_revaluations
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      asset_id: bigint fk -> assets.id not null
      revaluation_date: date not null
      net_book_value_at_revaluation_cents: bigint not null
      accumulated_depreciation_at_revaluation_cents: bigint not null
      new_valuation_cents: bigint not null
      new_residual_value_cents: bigint null
      new_useful_life_years: integer null
      reason: text not null
      approved_by: bigint fk -> users.id on delete set null null
      journal_entry_id: bigint fk -> journal_entries.id on delete set null null
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  AuditLog:   # table: audit_logs
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete set null null
      user_id: bigint fk -> users.id on delete set null null
      action: character varying(255) not null
      entity_type: character varying(255) not null
      entity_id: bigint not null
      old_values: json null
      new_values: json null
      ip_address: character varying(255) null
      created_at: timestamp(0) without time zone not null default CURRENT_TIMESTAMP
    indexes:
      - [tenant_id, entity_type, entity_id]
  BankAccount:   # table: bank_accounts
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      bank_name: character varying(255) not null
      account_number: character varying(255) not null
      currency_id: bigint fk -> currencies.id not null
      gl_account_id: bigint fk -> chart_of_accounts.id not null
      status: character varying(255) not null default 'active'
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  BillOfMaterial:   # table: bill_of_materials
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      finished_good_item_id: bigint fk -> items.id not null
      wastage_allowance_pct: numeric(6,4) not null default '0'
      tolerance_pct: numeric(6,4) null
      source: character varying(255) not null
      project_id: bigint fk -> projects.id on delete set null null
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
    indexes:
      - [tenant_id, finished_good_item_id]
  BillOfMaterialLine:   # table: bill_of_material_lines
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      bill_of_materials_id: bigint fk -> bill_of_materials.id on delete cascade not null
      raw_material_item_id: bigint fk -> items.id not null
      quantity: numeric(15,4) not null
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
    indexes:
      - [bill_of_materials_id]
  Boq:   # table: boqs
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      boqable_type: character varying(255) not null
      boqable_id: bigint not null
      revised_contract_value_cents: bigint null
      uses_sections: boolean not null default false
      source: character varying(255) not null default 'manual'
      source_file_path: character varying(255) null
      status: character varying(255) not null default 'draft'
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
    indexes:
      - [tenant_id, boqable_type, boqable_id]
  BoqImportStaging:   # table: boq_import_stagings
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      project_id: bigint fk -> projects.id on delete set null null
      boq_id: bigint fk -> boqs.id on delete set null null
      source_file_path: character varying(255) null
      raw_row_data: json not null
      mapped_item_id: bigint fk -> items.id on delete set null null
      mapped_section: character varying(255) null
      mapped_quantity: numeric(18,4) null
      mapped_rate_cents: bigint null
      status: character varying(255) not null default 'pending_review'
      reviewed_by: bigint fk -> users.id on delete set null null
      boq_line_id: bigint fk -> boq_lines.id on delete set null null
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  BoqLine:   # table: boq_lines
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      boq_id: bigint fk -> boqs.id on delete cascade not null
      section_id: bigint fk -> boq_sections.id on delete set null null
      item_id: bigint fk -> items.id on delete set null null
      description: character varying(255) not null
      unit: character varying(255) null
      quantity: numeric(18,4) not null
      rate_cents: bigint not null
      amount_cents: bigint not null
      line_type: character varying(255) not null default 'measured'
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  BoqSection:   # table: boq_sections
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      boq_id: bigint fk -> boqs.id on delete cascade not null
      parent_section_id: bigint fk -> boq_sections.id on delete set null null
      name: character varying(255) not null
      sequence: integer not null default 0
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  CapitalMovement:   # table: capital_movements
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      direction: character varying(255) not null
      amount_cents: bigint not null
      party_id: bigint fk -> parties.id null
      movement_date: date not null
      journal_entry_id: bigint fk -> journal_entries.id on delete set null null
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  Category:   # table: categories
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      name: character varying(255) not null
      parent_category_id: bigint fk -> categories.id on delete set null null
      valuation_method: character varying(255) not null
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  ChartOfAccount:   # table: chart_of_accounts
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      code: character varying(255) not null unique(tenant_id, code)
      name: character varying(255) not null unique(tenant_id, name)
      account_type: character varying(255) not null
      sub_type: character varying(255) null
      parent_account_id: bigint fk -> chart_of_accounts.id on delete set null null
      is_contra: boolean not null default false
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
    indexes:
      - [tenant_id, account_type]
  ComplianceDocument:   # table: compliance_documents
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      party_id: bigint fk -> parties.id not null
      document_type: character varying(255) not null
      issue_date: date not null
      expiry_date: date null
      file_path: character varying(255) null
      status: character varying(255) not null default 'valid'
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  ContractRetentionTerms:   # table: contract_retention_terms
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      contract_type: character varying(255) not null
      contract_id: bigint not null
      direction: character varying(255) not null
      retention_percentage: numeric(8,4) not null
      retention_cap_cents: bigint null
      first_release_trigger: character varying(255) not null default 'practical_completion'
      second_release_trigger: character varying(255) not null default 'dlp_end'
      dlp_duration_months: integer null
      release_trigger_source: character varying(255) null
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
    indexes:
      - [tenant_id, contract_type, contract_id]
  CreditApproval:   # table: credit_approvals
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      sales_order_id: bigint fk -> sales_orders.id null
      invoice_id: bigint fk -> invoices.id null
      requested_amount_cents: bigint not null
      approved_by: bigint fk -> users.id on delete set null null
      approved_at: timestamp(0) without time zone null
      notes: text null
      status: character varying(255) not null default 'pending'
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
      second_approved_by: bigint fk -> users.id on delete set null null
  CreditNote:   # table: credit_notes
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      document_number: character varying(255) null
      invoice_id: bigint fk -> invoices.id not null
      amount_cents: bigint not null
      reason: character varying(255) not null
      etr_serial_number: character varying(255) null
      etims_invoice_number: character varying(255) null
      note_date: date not null
      posting_date: date not null
      status: character varying(255) not null default 'draft'
      journal_entry_id: bigint fk -> journal_entries.id on delete set null null
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  Currency:   # table: currencies
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      code: character varying(255) not null unique(tenant_id, code)
      name: character varying(255) not null
      is_base: boolean not null default false
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  DebitNote:   # table: debit_notes
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      document_number: character varying(255) null
      invoice_id: bigint fk -> invoices.id not null
      amount_cents: bigint not null
      reason: character varying(255) not null
      etr_serial_number: character varying(255) null
      etims_invoice_number: character varying(255) null
      note_date: date not null
      posting_date: date not null
      status: character varying(255) not null default 'draft'
      journal_entry_id: bigint fk -> journal_entries.id on delete set null null
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  Defect:   # table: defects
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      project_id: bigint fk -> projects.id not null
      subcontract_id: bigint fk -> subcontracts.id on delete set null null
      milestone_id: bigint fk -> milestones.id on delete set null null
      description: character varying(255) not null
      severity: character varying(255) not null
      blocks_retention: boolean not null default false
      reported_by: bigint fk -> users.id on delete set null null
      reported_date: date not null
      target_fix_date: date null
      status: character varying(255) not null default 'open'
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  Delivery:   # table: deliveries
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      sales_order_id: bigint fk -> sales_orders.id not null
      warehouse_id: bigint fk -> warehouses.id not null
      status: character varying(255) not null default 'pending'
      delivered_at: timestamp(0) without time zone null
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  DeliveryLine:   # table: delivery_lines
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      delivery_id: bigint fk -> deliveries.id on delete cascade not null
      sales_order_line_id: bigint fk -> sales_order_lines.id not null
      quantity_delivered: numeric(18,4) not null
      cogs_value_cents: bigint not null default '0'
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  DemandTrigger:   # table: demand_triggers
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      source_type: character varying(255) not null
      source_id: bigint null
      item_id: bigint fk -> items.id not null
      warehouse_id: bigint fk -> warehouses.id not null
      quantity_needed: numeric(15,4) not null
      status: character varying(255) not null default 'open'
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
    indexes:
      - [tenant_id, item_id, warehouse_id, status]
  DocumentSequence:   # table: document_sequences
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      entity_type: character varying(255) not null
      prefix: character varying(255) not null
      fiscal_year: smallint not null unique(tenant_id, entity_type, fiscal_year)
      next_number: bigint not null default '1'
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  DummyRecord:   # table: dummy_records
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      created_by: bigint fk -> users.id not null
      name: character varying(255) not null
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
      record_date: date null
      accounting_period_id: bigint fk -> accounting_periods.id null
      original_intended_posting_date: date null
  Employee:   # table: employees
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      employee_number: character varying(255) not null unique(tenant_id, employee_number)
      name: character varying(255) not null
      id_number: character varying(255) not null
      kra_pin: character varying(255) not null
      nssf_number: character varying(255) not null
      shif_number: character varying(255) not null
      helb_account_number: character varying(255) null
      employment_type: character varying(255) not null
      date_of_hire: date not null
      date_of_exit: date null
      cumulative_casual_days_worked: integer null
      casual_conversion_due: boolean not null default false
      status: character varying(255) not null default 'active'
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  EmploymentContract:   # table: employment_contracts
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      employee_id: bigint fk -> employees.id not null
      contract_type: character varying(255) not null
      pay_frequency: character varying(255) not null
      basic_salary_cents: bigint null
      hourly_rate_cents: bigint null
      daily_rate_cents: bigint null
      overtime_multiplier_weekday: numeric(4,2) not null default 1.5
      overtime_multiplier_restday: numeric(4,2) not null default '2'
      start_date: date not null
      end_date: date null
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  EquipmentHireContract:   # table: equipment_hire_contracts
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      party_id: bigint fk -> parties.id not null
      description: character varying(255) not null
      project_id: bigint fk -> projects.id not null
      hire_rate_cents: bigint not null
      hire_start_date: date not null
      hire_end_date: date null
      invoiced_days: integer null
      hire_invoice_mismatch: boolean not null default false
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  EtimsItemClassification:   # table: etims_item_classifications
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      code: character varying(255) not null unique(tenant_id, code)
      name: character varying(255) null
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  EtimsSubmission:   # table: etims_submissions
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      type: character varying(255) not null
      status: character varying(255) not null default 'pending'
      request_payload: json null
      response_payload: json null
      result_code: character varying(255) null
      result_desc: character varying(255) null
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  FeasibilityAssessment:   # table: feasibility_assessments
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      sales_order_id: bigint fk -> sales_orders.id on delete cascade not null
      assessed_by: bigint fk -> users.id on delete set null null
      assessed_at: timestamp(0) without time zone null
      result: character varying(255) not null
      notes: text null
      conditions: text null
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  FinalSettlement:   # table: final_settlements
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      employee_id: bigint fk -> employees.id not null
      payslip_id: bigint fk -> payslips.id on delete set null null
      last_working_day: date not null
      days_worked_this_period: numeric(5,2) not null
      accrued_leave_days: numeric(5,2) not null
      leave_encashment_amount_cents: bigint null
      final_paye_amount_cents: bigint not null
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
  GRNLine:   # table: grn_lines
    fields:
      id: bigint pk not null
      tenant_id: bigint fk -> tenants.id on delete cascade not null
      grn_id: bigint fk -> goods_receipt_notes.id on delete cascade not null
      purchase_order_line_id: bigint fk -> purchase_order_lines.id not null
      item_id: bigint fk -> items.id not null
      quantity_received: numeric(15,4) not null
      unit_cost_cents: bigint not null
      quarantine_status: character varying(255) not null default 'pending'
      stock_quarantine_id: bigint fk -> stock_quarantines.id on delete set null null
      created_at: timestamp(0) without time zone null
      updated_at: timestamp(0) without time zone null
    indexes:
      - [grn_id]
      - [purchase_order_line_id]
  GoodsReceiptNote:   # table: goods_receipt_notes
    fields:
