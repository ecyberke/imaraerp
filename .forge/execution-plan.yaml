    goal: 'PRs #18 -> #19 -> #20 merged in order by a human (eTIMS behind a default-off flag), constitution and ADRs approved, baseline inventory and test
      registry populated, README reproducible, CI running. Exit: forge validate exit 0 on main; workflow stage advanced to PLAN.'
