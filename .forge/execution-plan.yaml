    goal: 'Self-audit across 23 categories from real evidence; RC on the application profile -> VERIFIED; same artifact on staging -> STAGING_VERIFIED;
      UAT, independent security review, rehearsed rollback plans and operational handoff; human sign-off -> PRODUCTION_APPROVED; deploy and smoke -> PRODUCTION_VERIFIED.
