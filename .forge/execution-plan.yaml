    goal: 'Every R4 application-profile dimension has a command that can fail. Missing proofs added for existing behaviour: authorization matrix, payroll
      confidentiality, four new concurrency tests, audit coverage, MFA route sweep, cross-tenant sweep, contract tests, e2e journeys. Exit: build, typecheck,
      lint, unit, integration, contract, e2e green on CI; every POLICY-* and concurrency INV-* has a passing test.'
