  notes: 'Baseline tasks TASK-001..018 are done and listed in no phase. Phases 2-4 can overlap once Phase 1 exits, but every task respects depends_on (forge
    validate rejects out-of-order starts). Nothing merges autonomously: each task is a branch and PR reviewed by a human, as in v1.0. Tasks marked blocked
    wait on external human actions (KRA OSCU registration, Daraja credentials, role decision) and never block the release by themselves — if still blocked
    at Phase 6 they move to v1.2.0 via an RC-scoped exception with an expiry, never a project-scoped one (R4). Maturity for this brownfield baseline starts
    at PLANNED. PLANNED -> SPECIFIED and SPECIFIED -> IMPLEMENTED are human gates in Forge (no profile): take the first when TASK-103 approves the constitution
    and ADRs, the second when every non-blocked Phase 1-5 task is done. IMPLEMENTED -> VERIFIED, -> STAGING_VERIFIED, -> PRODUCTION_APPROVED and PRODUCTION_DEPLOYED -> PRODUCTION_VERIFIED are gate-enforced; PRODUCTION_APPROVED -> PRODUCTION_DEPLOYED is a third human gate. Human gates are passed by the owner editing state.yaml then running forge state reset-integrity, with the approval recorded in the commit message. R4 adds no
    independent security review or enforced segregation of duties — TASK-194 supplies the first by hand.'
